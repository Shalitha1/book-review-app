name: Book Review CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-review-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  WEB_EC2_HOST: "43.205.228.245"
  APP_EC2_HOST: "10.0.11.59"
  PUBLIC_ALB_URL: "http://book-review-public-alb-969320032.ap-south-1.elb.amazonaws.com"

jobs:
  backend-ci:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate backend
        run: npm run check

  frontend-ci:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy to AWS production
    if: github.event_name != 'pull_request' && vars.ENABLE_DEPLOYMENT == 'true'
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WEB_EC2_SSH_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          cat > "$HOME/.ssh/config" <<EOF
          Host book-review-web
            HostName ${WEB_EC2_HOST}
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new

          Host book-review-app
            HostName ${APP_EC2_HOST}
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ProxyJump book-review-web
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Deploy backend through Web EC2 jump host
        run: |
          ssh -o BatchMode=yes book-review-app \
            "sudo bash -lc 'cd /home/ubuntu/book-review-app-v2 && git pull --ff-only origin main && bash scripts/deploy-backend.sh'"

      - name: Deploy frontend
        run: |
          ssh -o BatchMode=yes book-review-web \
            "sudo bash -lc 'cd /home/ubuntu/book-review-app-v2 && git pull --ff-only origin main && bash scripts/deploy-frontend.sh'"

      - name: Verify public application
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 "${PUBLIC_ALB_URL}/" > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 "${PUBLIC_ALB_URL}/api/books" > /dev/null
          echo "Public application passed smoke tests."
