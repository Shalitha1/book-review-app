name: Backend CI

# Run automatically for backend changes and allow manual practice runs.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

# The workflow only needs permission to read this repository.
permissions:
  contents: read

jobs:
  validate-backend:
    name: Install and validate backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate backend JavaScript
        run: npm run check

      - name: Run backend tests
        run: npm test
