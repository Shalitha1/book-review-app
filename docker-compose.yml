services:

  mysql:
    image: mysql:8.0

    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: book_review_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-pmy-secret-pw"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    environment:
      PORT: 3010
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: book_review_db
      DB_USER: admin
      DB_PASS: admin123
      DB_SSL: "false"
      JWT_SECRET: local-development-secret
      ALLOWED_ORIGINS: http://localhost:3000

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "3010:3010"


  frontend:
    build:
      context: ./frontend
      args:
         NEXT_PUBLIC_API_URL: http://localhost:3010

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3010

    depends_on:
      - backend

    ports:
      - "3000:3000"


volumes:
  mysql_data:



