apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: book-review

spec:
  type: ClusterIP

  selector:
    app: backend

  ports:
    - name: http
      port: 3010
      targetPort: 3010


---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: book-review

spec:

  replicas: 2

  strategy:

    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:

    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

        - name: backend

          image: book-review-backend:1.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3010

          env:

            - name: PORT
              value: "3010"

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: book-review-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: book-review-config
                  key: MYSQL_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: book-review-config
                  key: MYSQL_DATABASE

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: book-review-config
                  key: MYSQL_USER

            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: book-review-secret
                  key: MYSQL_PASSWORD

            - name: DB_SSL
              valueFrom:
                configMapKeyRef:
                  name: book-review-config
                  key: DB_SSL

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: book-review-secret
                  key: JWT_SECRET

            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: book-review-config
                  key: ALLOWED_ORIGINS

          readinessProbe:

            httpGet:
              path: /health
              port: 3010

            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:

            httpGet:
              path: /health
              port: 3010

            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:

            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi